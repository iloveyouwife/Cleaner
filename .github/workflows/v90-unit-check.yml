name: Verify v90 discovery gate and all Cleaner unit tests
on:
  push:
    branches: ['ci/v90-unit-verification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          brew install xcodegen
          cd WorseCleanerBuild && xcodegen generate
      - name: Verify safety invariants
        run: python3 WorseCleanerBuild/scripts/verify_source_guards.py
      - name: Run all Cleaner unit tests on iOS Simulator
        run: |
          set -euo pipefail
          sim="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Pro") | .udid][0] // [.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$sim"
          xcodebuild test \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$sim" \
            -derivedDataPath "$PWD/DerivedDataV90Logic" \
            -resultBundlePath "$PWD/v90-unit-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:CleanerUnitTests \
            CODE_SIGNING_ALLOWED=NO \
            test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v90-logic-test-results
          path: v90-unit-tests.xcresult
          if-no-files-found: ignore
