name: Verify Cleaner v90 permission gate

on:
  push:
    branches: ['release/v90-test-ipa']
    paths: ['.github/workflows/v90-permission-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-tests:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 and generate project
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          brew install xcodegen
          cd WorseCleanerBuild
          xcodegen generate
      - name: Execute targeted permission regressions
        run: |
          set -euo pipefail
          sim="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Pro") | .udid][0] // [.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$sim"
          xcodebuild test \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$sim" \
            -derivedDataPath "$PWD/DerivedDataV90Permission" \
            -resultBundlePath "$PWD/v90-permission-tests.xcresult" \
            -parallel-testing-enabled NO \
            -only-testing:CleanerUnitTests/CleanerUnitTests/testDiscoveryRequiresBothAvailableAndConfirmedAppGroup \
            -only-testing:CleanerUnitTests/CleanerUnitTests/testRevokingPermissionDropsDisplayedCacheAndBlocksDiscovery \
            CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v90-permission-unit-tests
          path: v90-permission-tests.xcresult
          if-no-files-found: ignore
