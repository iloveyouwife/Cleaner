name: iOS 15.4 TrollStore legacy read-only probe

on:
  push:
    branches: ['research/ios15-trollstore']
    paths:
      - 'LegacyProbe/**'
      - '.github/workflows/legacy-probe-ios15.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen and ldid
        run: brew install xcodegen ldid
      - name: Generate iOS 15.4 project
        run: |
          cd LegacyProbe
          xcodegen generate
      - name: Build Objective-C only iOS 15.4 target
        run: |
          set -euo pipefail
          xcodebuild \
            -project LegacyProbe/CleanerLegacyProbe.xcodeproj \
            -scheme LegacyProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/LegacyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check legacy deployment, compiled app icon, no Swift runtime
        run: |
          set -euo pipefail
          app="LegacyDerivedData/Build/Products/Release-iphoneos/LegacyProbe.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = "15.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")" = "LegacyProbe"
          test -f "$app/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon' "$app/Info.plist"
          otool -L "$app/LegacyProbe" | tee legacy-dependencies.txt
          ! grep -q '/usr/lib/swift/' legacy-dependencies.txt
          ! grep -q 'SwiftUI.framework' legacy-dependencies.txt
          ! grep -q 'worse_query' legacy-dependencies.txt
          file "$app/LegacyProbe"
      - name: Sign read-only TrollStore no-sandbox probe
        run: |
          set -euo pipefail
          mkdir -p LegacyPayload/Payload
          cp -R LegacyDerivedData/Build/Products/Release-iphoneos/LegacyProbe.app LegacyPayload/Payload/
          app="LegacyPayload/Payload/LegacyProbe.app"
          ldid -SLegacyProbe/LegacyProbe/LegacyProbe.entitlements "$app/LegacyProbe"
          ldid -e "$app/LegacyProbe" > legacy-embedded-entitlements.xml
          grep -q "com.apple.private.security.no-sandbox" legacy-embedded-entitlements.xml
          ! grep -Eq "com.apple.private.cs.debugger|dynamic-codesigning|com.apple.private.skip-library-validation" legacy-embedded-entitlements.xml
          cd LegacyPayload
          zip -qr ../Cleaner-LegacyProbe-v0.2-iOS15.4-TrollStore.ipa Payload
          cd ..
          unzip -tq Cleaner-LegacyProbe-v0.2-iOS15.4-TrollStore.ipa
      - name: Package sandbox-only launch diagnostic as fallback
        run: |
          set -euo pipefail
          mkdir -p SandboxPayload/Payload
          cp -R LegacyDerivedData/Build/Products/Release-iphoneos/LegacyProbe.app SandboxPayload/Payload/
          app="SandboxPayload/Payload/LegacyProbe.app"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.iloveyouwife.cleaner.legacyprobe.sandbox' "$app/Info.plist"
          ldid -S "$app/LegacyProbe"
          cd SandboxPayload
          zip -qr ../Cleaner-LegacyProbe-v0.2-LaunchOnly.ipa Payload
          cd ..
          unzip -tq Cleaner-LegacyProbe-v0.2-LaunchOnly.ipa
      - name: Upload both test IPAs
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-LegacyProbe-v0.2-iOS15.4
          path: |
            Cleaner-LegacyProbe-v0.2-iOS15.4-TrollStore.ipa
            Cleaner-LegacyProbe-v0.2-LaunchOnly.ipa
          if-no-files-found: error
