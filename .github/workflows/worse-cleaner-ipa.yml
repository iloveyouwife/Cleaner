name: Build WorseCleaner unsigned IPA

on:
  push:
    branches:
      - worse-query-cleaner
      - worse-query-cleaner-fix
      - worse-query-cleaner-v3
      - worse-query-cleaner-v4
      - worse-query-cleaner-v5
      - worse-query-cleaner-v6
      - worse-query-cleaner-v7
      - worse-query-cleaner-v8
      - worse-query-cleaner-v9
      - worse-query-cleaner-v10
      - worse-query-cleaner-v11
      - worse-query-cleaner-v12
      - worse-query-cleaner-v13
      - worse-query-cleaner-v14
      - worse-query-cleaner-v15
      - worse-query-cleaner-v16
      - worse-query-cleaner-v17
      - worse-query-cleaner-v18
      - worse-query-cleaner-v19
      - worse-query-cleaner-v20
      - worse-query-cleaner-v21
      - worse-query-cleaner-v22
      - worse-query-cleaner-v23
      - worse-query-cleaner-v24
      - worse-query-cleaner-v25
      - worse-query-cleaner-v26
      - worse-query-cleaner-v27
      - worse-query-cleaner-v44
      - worse-query-cleaner-v45
      - worse-query-cleaner-v46
      - worse-query-cleaner-v47
      - worse-query-cleaner-v48
      - worse-query-cleaner-v49
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select and inspect Xcode 27.0
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          xcode_version="$(xcodebuild -version)"
          sdk_list="$(xcodebuild -showsdks)"
          echo "$xcode_version"
          echo "$sdk_list"
          [[ "$xcode_version" == Xcode\ 27.0* ]]
          [[ "$sdk_list" == *iphoneos27.0* ]]

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd WorseCleanerBuild
          xcodegen generate

      - name: Compile unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app Payload/
          zip -q -r WorseCleaner-iOS27-unsigned.ipa Payload
          unzip -tq WorseCleaner-iOS27-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorseCleaner-iOS27-unsigned
          path: WorseCleaner-iOS27-unsigned.ipa
          if-no-files-found: error

      # Required simulator UI regression checks. Screenshot fixtures bypass
      # discovery only on the simulator, never signed-device safeguards.
      - name: Capture native UI layouts
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/DerivedDataSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Pro") | .udid][0] // [.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" DerivedDataSimulator/Build/Products/Release-iphonesimulator/WorseCleaner.app
          mkdir -p ui-screenshots
          xcrun simctl ui "$simulator_id" appearance light
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureToolbarHome
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/home-light.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureAdvancedSettings
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/settings-light.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureExcludedApps
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/excluded-light.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl ui "$simulator_id" appearance dark
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureToolbarHome
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/home-dark.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureAdvancedSettings
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/settings-dark.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner || true
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureExcludedApps
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/excluded-dark.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl ui "$simulator_id" appearance light
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -capturePopulatedHome
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/populated-light.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -capturePopulatedSelection
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/populated-selected-light.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl ui "$simulator_id" appearance dark
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -capturePopulatedHome
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/populated-dark.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl ui "$simulator_id" appearance light
          if xcrun simctl ui "$simulator_id" content_size accessibility-medium; then
            xcrun simctl launch "$simulator_id" com.example.worsecleaner -capturePopulatedHome
            sleep 3
            xcrun simctl io "$simulator_id" screenshot ui-screenshots/populated-accessibility-medium.png
            xcrun simctl terminate "$simulator_id" com.example.worsecleaner
            xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureAdvancedSettings
            sleep 3
            xcrun simctl io "$simulator_id" screenshot ui-screenshots/settings-accessibility-medium.png
            xcrun simctl terminate "$simulator_id" com.example.worsecleaner
            xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureExcludedApps
            sleep 3
            xcrun simctl io "$simulator_id" screenshot ui-screenshots/excluded-accessibility-medium.png
            xcrun simctl terminate "$simulator_id" com.example.worsecleaner
            xcrun simctl ui "$simulator_id" content_size large || true
          fi

      - name: Capture native toolbar menus with UI tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 16 Pro") | .udid][0] // [.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$simulator_id"
          xcodebuild test \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$PWD/DerivedDataUITests" \
            -resultBundlePath "$PWD/cleaner-ui-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
          mkdir -p ui-menu-screenshots
          xcrun xcresulttool export attachments \
            --path cleaner-ui-tests.xcresult \
            --output-path ui-menu-screenshots

      - name: Upload layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-layout-preview-v49
          path: |
            ui-screenshots/*.png
            ui-menu-screenshots/**
          if-no-files-found: ignore
