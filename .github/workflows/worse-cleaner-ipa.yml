name: Build WorseCleaner unsigned IPA

on:
  push:
    branches:
      - worse-query-cleaner
      - worse-query-cleaner-fix
      - worse-query-cleaner-v3
      - worse-query-cleaner-v4
      - worse-query-cleaner-v5
      - worse-query-cleaner-v6
      - worse-query-cleaner-v7
      - worse-query-cleaner-v8
      - worse-query-cleaner-v9
      - worse-query-cleaner-v10
      - worse-query-cleaner-v11
      - worse-query-cleaner-v12
      - worse-query-cleaner-v13
      - worse-query-cleaner-v14
      - worse-query-cleaner-v15
      - worse-query-cleaner-v16
      - worse-query-cleaner-v17
      - worse-query-cleaner-v18
      - worse-query-cleaner-v19
      - worse-query-cleaner-v20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd WorseCleanerBuild
          xcodegen generate

      - name: Compile unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app Payload/
          zip -q -r WorseCleaner-iOS27-unsigned.ipa Payload
          unzip -tq WorseCleaner-iOS27-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorseCleaner-iOS27-unsigned
          path: WorseCleaner-iOS27-unsigned.ipa
          if-no-files-found: error

      # Best-effort visual QA for the SwiftUI settings layout. Simulator-only
      # launch arguments bypass discovery, never the signed-device safeguards.
      - name: Capture advanced settings layout
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/DerivedDataSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0] // empty')"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id" || true
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" DerivedDataSimulator/Build/Products/Release-iphonesimulator/WorseCleaner.app
          mkdir -p ui-screenshots
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureToolbarHome
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/toolbar-home.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureAdvancedSettings
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/advanced-settings.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureSortPopup
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/sort-popup.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureSelectionPopup
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/selection-popup.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureSelectionPopupSelected
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/selection-popup-selected.png
          xcrun simctl terminate "$simulator_id" com.example.worsecleaner
          xcrun simctl launch "$simulator_id" com.example.worsecleaner -captureMorePopup
          sleep 3
          xcrun simctl io "$simulator_id" screenshot ui-screenshots/more-popup.png

      - name: Upload layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-layout-preview
          path: ui-screenshots/*.png
          if-no-files-found: ignore
