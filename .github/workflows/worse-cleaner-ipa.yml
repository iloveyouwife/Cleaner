name: Build WorseCleaner unsigned IPA

on:
  push:
    branches:
      - worse-query-cleaner
      - worse-query-cleaner-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cd WorseCleanerBuild
          xcodegen generate

      - name: Compile unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project WorseCleanerBuild/WorseCleaner.xcodeproj \
            -scheme WorseCleaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/WorseCleaner.app Payload/
          zip -q -r WorseCleaner-iOS27-unsigned.ipa Payload
          unzip -tq WorseCleaner-iOS27-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorseCleaner-iOS27-unsigned
          path: WorseCleaner-iOS27-unsigned.ipa
          if-no-files-found: error
