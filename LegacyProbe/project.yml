name: CleanerLegacyProbe
options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "15.4"
  xcodeVersion: "27.0"
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
targets:
  LegacyProbe:
    type: application
    platform: iOS
    sources:
      # Do NOT compile the historical SwiftUI prototype on iOS 15.
      - path: LegacyProbe/ObjC
      - path: LegacyProbe/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iloveyouwife.cleaner.legacyprobe
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LegacyProbe/LegacyProbe.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Cleaner Legacy
        INFOPLIST_KEY_CFBundleDevelopmentRegion: zh-Hans
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        IPHONEOS_DEPLOYMENT_TARGET: "15.4"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LegacyProbe:
    build:
      targets:
        LegacyProbe: all
